# ==============================================================
# MovieMate - Backend Configuration
# ==============================================================

# Server Port
server.port=${PORT:8080}

# --------------------------------------------------------------
# 1. MySQL Configuration (User Accounts & Authentication)
# --------------------------------------------------------------
# Default points to local MySQL. Environment variables can override these:
spring.config.import=optional:file:.env[.properties]
# MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000

# --------------------------------------------------------------
# 2. MongoDB Configuration (Movies, Cinemas, Showtimes, Bookings)
# --------------------------------------------------------------
# Default points to local MongoDB. Can also use MongoDB Atlas URL:
# e.g., mongodb+srv://username:password@cluster.mongodb.net/moviemate
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# --------------------------------------------------------------
# 3. Educational JSP View Resolver (Only for Servlet/JSP demo)
# --------------------------------------------------------------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --------------------------------------------------------------
# 4. Session Configuration
# --------------------------------------------------------------

server.servlet.session.cookie.name=MOVIEMATE_SESSION
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Logging
logging.level.com.moviemate=INFO
logging.level.org.springframework.jdbc.core=INFO
